name: core tests

on:
  push:
    paths:
      - "main.py"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements.lock"
      - "requirements-dev.txt"
      - ".coveragerc"
      - "mcp-endpoint-server.cfg"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "main.py"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements.lock"
      - "requirements-dev.txt"
      - ".coveragerc"
      - "mcp-endpoint-server.cfg"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q main.py src

      - name: Run unit tests with coverage
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m coverage run -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage report -m