name: mcp-bridge tests

on:
  push:
    paths:
      - "mcp-bridge/**"
      - ".github/workflows/mcp-bridge-tests.yml"
  pull_request:
    paths:
      - "mcp-bridge/**"
      - ".github/workflows/mcp-bridge-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-bridge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: mcp-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp-bridge/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m unittest discover -s tests -p 'test_mcp_bridge.py' -v
