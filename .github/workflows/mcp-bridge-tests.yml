name: mcp-bridge tests

on:
  push:
    paths:
      - "mcp-bridge/**"
      - ".github/workflows/mcp-bridge-tests.yml"
  pull_request:
    paths:
      - "mcp-bridge/**"
      - ".github/workflows/mcp-bridge-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-bridge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: mcp-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            mcp-bridge/requirements.txt
            mcp-bridge/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "coverage>=7.17.4,<8.0"

      - name: Run unit tests with coverage
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m coverage run --source=mcp_bridge -m unittest discover -s tests -p 'test_mcp_bridge.py' -v
          python -m coverage report -m

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build bridge image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-bridge
          file: ./mcp-bridge/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
