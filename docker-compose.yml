# Docker 部署
services:
  mcp-endpoint-server:
    image: kid941005/mcp-endpoint-server:latest
    # 需要本地构建时取消注释（Docker Desktop 已启动）：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: mcp-endpoint-server
    restart: always
    ports:
      - "8004:8004"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 配置与密钥（server.key、加密 token）持久化
      - ./data:/app/data
      # 日志持久化
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/mcp_endpoint/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 容器内以 appuser(uid 1000) 运行，首次部署前：
    #   mkdir -p data logs && sudo chown -R 1000:1000 data logs
